version: '3.8'

services:
  govbench-dashboard:
    build: .
    container_name: govbench-clinical-app
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - ./results:/app/results
      - ./benchmarks:/app/benchmarks
    restart: unless-stopped

  govbench-runner:
    build: .
    container_name: govbench-clinical-cli
    profiles: ["cli"]
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEFAULT_LLM_PROVIDER=groq
    volumes:
      - ./results:/app/results
      - ./benchmarks:/app/benchmarks
    command: python -m scripts.run_full_benchmark --total-cases 10 --provider groq --workers 1
