[project]
name = "govbench-clinical"
version = "0.1.0"
description = "A Benchmark Framework for Quantifying Governance-Cost Tradeoffs in Multi-Agent Clinical Diagnosis Systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "plotly>=5.18.0",
    "streamlit>=1.35.0",
    "datasets>=2.18.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

